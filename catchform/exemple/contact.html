<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — exemple de site statique</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; background: #f6f7fb; color: #0f172a; margin: 0; }
    .wrap { max-width: 520px; margin: 60px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e6e8ef; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 6px; }
    p.intro { color: #64748b; margin: 0 0 24px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 16px; }
    input, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 11px 13px; border: 1px solid #e6e8ef; border-radius: 10px; font: inherit; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #6366f1; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #status { margin: 14px 0 0; text-align: center; font-weight: 500; min-height: 1.4em; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Contacte-moi</h1>
      <p class="intro">Exemple de page 100 % statique (aucun backend) qui envoie son formulaire à CatchForm.</p>

      <!-- Remplace l'URL ci-dessous par l'endpoint copié dans ton tableau de bord CatchForm. -->
      <form id="contact" method="POST" action="http://127.0.0.1:5000/f/REMPLACE-MOI">
        <label>Nom <input name="nom" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Message <textarea name="message" rows="5" required></textarea></label>

        <!-- Objet de l'e-mail de notification (optionnel). -->
        <input type="hidden" name="_subject" value="Nouveau message depuis mon site">
        <!-- Piège à robots : invisible pour les humains, ne pas supprimer. -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">

        <button type="submit">Envoyer</button>
        <p id="status" role="status"></p>
      </form>
    </div>
  </main>

  <script>
    // Optionnel : envoi en arrière-plan, sans quitter la page.
    // Sans ce script, le formulaire fonctionne quand même (envoi classique).
    const form = document.getElementById('contact');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Envoi en cours…';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' },
        });
        const result = await response.json();
        if (result.ok) {
          form.reset();
          status.textContent = 'Merci, ton message a bien été envoyé ✓';
        } else {
          status.textContent = 'Erreur : ' + result.error;
        }
      } catch (error) {
        status.textContent = "Impossible d'envoyer le message. Réessaie plus tard.";
      }
    });
  </script>
</body>
</html>
