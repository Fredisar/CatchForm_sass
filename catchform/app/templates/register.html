{% extends "base.html" %}
{% block title %}Créer un compte — CatchForm{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Crée ton compte</h1>
    <p class="sub">Gratuit, sans carte bancaire. Ton premier endpoint en 30 secondes.</p>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="8 caractères minimum">
        <p class="hint">Au moins 8 caractères.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
    </form>
    <p class="auth-switch">Déjà inscrit ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
  </div>
</div>
{% endblock %}
